<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPACE TV Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <style>
    :root {
      --plyr-color-main: #35c6ff;
      --plyr-video-controls-background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(4, 10, 18, 0.9) 100%);
      --plyr-menu-background: rgba(8, 16, 28, 0.96);
      --plyr-menu-color: #f8fcff;
      --plyr-tooltip-background: rgba(7, 15, 26, 0.94);
      --plyr-tooltip-color: #ffffff;
      --plyr-control-icon-size: 18px;
      --plyr-control-spacing: 12px;
      --plyr-control-radius: 12px;
      --plyr-range-thumb-height: 18px;
      --plyr-range-track-height: 6px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #player-wrap,
    #native-player,
    #fallback-frame,
    .plyr {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #player-wrap {
      z-index: 2;
    }

    #fallback-frame {
      border: 0;
      display: none;
      z-index: 1;
    }

    .plyr__controls {
      padding: 16px 18px 18px;
      background: linear-gradient(180deg, rgba(4, 10, 18, 0) 0%, rgba(4, 10, 18, 0.92) 100%);
    }

    .plyr__control,
    .plyr__menu__container,
    .plyr__tooltip,
    .plyr__progress__buffer {
      border-radius: 12px;
    }

    .plyr__menu__container {
      border: 1px solid rgba(53, 198, 255, 0.22);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    }

    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    #status.hidden {
      opacity: 0;
    }

    #status-copy {
      display: none;
      margin-top: 18px;
      min-width: 320px;
      max-width: 720px;
      color: rgba(255, 255, 255, 0.84);
      font-size: 20px;
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    #status.error #status-copy {
      display: block;
    }

    .loader {
      width: 48px;
      height: 48px;
      display: inline-block;
      position: relative;
    }

    .loader::after,
    .loader::before {
      content: '';
      box-sizing: border-box;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #35c6ff;
      box-shadow: 0 0 18px rgba(53, 198, 255, 0.24);
      position: absolute;
      left: 0;
      top: 0;
      animation: animloader 2s linear infinite;
    }

    .loader::after {
      animation-delay: 1s;
    }

    @keyframes animloader {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0;
      }
    }
  </style>
  <script src="legacy-polyfills.js"></script>
  <script>
    (function() {
      if (!window.performance) {
        window.performance = { now: function() { return new Date().getTime(); } };
      } else if (!window.performance.now) {
        window.performance.now = function() { return new Date().getTime(); };
      }

      if (!window.crypto) window.crypto = {};
      if (!window.crypto.getRandomValues) {
        window.crypto.getRandomValues = function(buffer) {
          var i;
          if (!buffer || typeof buffer.length !== 'number') throw new Error('Expected typed array');
          for (i = 0; i < buffer.length; i++) {
            buffer[i] = Math.floor(Math.random() * 256);
          }
          return buffer;
        };
      }

      if (!window.msCrypto) window.msCrypto = window.crypto;
    })();
  </script>
  <script src="_libsodium.js"></script>
  <script>window.libsodium = window.libsodium || window.sodium;</script>
  <script src="_libsodium_wrappers.js"></script>
  <script src="_vidlink_script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
</head>
<body>
  <div id="player-wrap">
    <video id="native-player" playsinline webkit-playsinline></video>
  </div>
  <iframe id="fallback-frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin-when-cross-origin"></iframe>
  <div id="status"><span class="loader" aria-hidden="true"></span><div id="status-copy"></div></div>
  <script>
    (function() {
      var video = document.getElementById('native-player');
      var wrap = document.getElementById('player-wrap');
      var fallbackFrame = document.getElementById('fallback-frame');
      var status = document.getElementById('status');
      var statusCopy = document.getElementById('status-copy');
      var player = null;
      var autoplay = false;
      var usingFallback = false;

      function getParam(name) {
        var search = window.location.search.replace(/^\?/, '');
        var parts;
        var i;
        if (!search) return '';
        parts = search.split('&');
        for (i = 0; i < parts.length; i++) {
          var section = parts[i].split('=');
          if (decodeURIComponent(section[0] || '') === name) {
            return decodeURIComponent((section.slice(1).join('=') || '').replace(/\+/g, '%20'));
          }
        }
        return '';
      }

      function requestText(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 0) callback(null, xhr.responseText);
            else callback(new Error('Request failed: ' + xhr.status), null);
          }
        };
        xhr.onerror = function(error) { callback(error || new Error('Network error'), null); };
        xhr.send();
      }

      function requestJson(url, callback) {
        requestText(url, function(error, text) {
          if (error) {
            callback(error, null);
            return;
          }
          try {
            callback(null, JSON.parse(text));
          } catch (parseError) {
            callback(parseError, null);
          }
        });
      }

      function requestArrayBuffer(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'arraybuffer';
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 0) callback(null, xhr.response);
            else callback(new Error('Request failed: ' + xhr.status), null);
          }
        };
        xhr.onerror = function(error) { callback(error || new Error('Network error'), null); };
        xhr.send();
      }

      function createAnchor(url) {
        var anchor = document.createElement('a');
        anchor.href = url;
        return anchor;
      }

      function toAbsoluteUrl(base, value) {
        var baseAnchor;
        var path;
        if (!value) return '';
        if (/^https?:\/\//i.test(value)) return value;
        if (/^\/\//.test(value)) return (window.location.protocol || 'https:') + value;
        baseAnchor = createAnchor(base || window.location.href);
        if (value.charAt(0) === '/') return baseAnchor.protocol + '//' + baseAnchor.host + value;
        path = (baseAnchor.pathname || '/');
        path = path.substring(0, path.lastIndexOf('/') + 1);
        return baseAnchor.protocol + '//' + baseAnchor.host + path + value;
      }

      function postEvent(name, data) {
        try {
          window.parent.postMessage({ data: { event: name, detail: data || null } }, '*');
        } catch (_error) {}
      }

      function showLoading() {
        status.className = '';
        statusCopy.textContent = '';
      }

      function showError(message) {
        status.className = 'error';
        statusCopy.textContent = message || 'Playback failed.';
      }

      function hideStatus() {
        if ((' ' + status.className + ' ').indexOf(' hidden ') === -1) status.className += ' hidden';
      }

      function initPlayer() {
        if (player || typeof Plyr === 'undefined') return;
        player = new Plyr(video, {
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
          settings: ['quality', 'speed'],
          keyboard: { focused: true, global: true },
          tooltips: { controls: true, seek: true },
          clickToPlay: true
        });
      }

      function clearTracks() {
        var tracks = video.querySelectorAll('track');
        var i;
        for (i = 0; i < tracks.length; i++) video.removeChild(tracks[i]);
      }

      function applyCaptions(captions) {
        var i;
        clearTracks();
        captions = captions || [];
        for (i = 0; i < captions.length; i++) {
          if (!captions[i].url) continue;
          var track = document.createElement('track');
          track.kind = 'subtitles';
          track.label = captions[i].language || ('Subtitle ' + (i + 1));
          track.srclang = (captions[i].language || 'en').substring(0, 2).toLowerCase();
          track.src = captions[i].url;
          if (i === 0) track.default = true;
          video.appendChild(track);
        }
      }

      function switchToNative() {
        usingFallback = false;
        fallbackFrame.style.display = 'none';
        wrap.style.display = 'block';
      }

      function switchToFallback(url) {
        usingFallback = true;
        wrap.style.display = 'none';
        fallbackFrame.style.display = 'block';
        fallbackFrame.onload = function() { hideStatus(); };
        fallbackFrame.src = url;
      }

      function sendControl(action) {
        if (usingFallback) {
          try {
            fallbackFrame.contentWindow.postMessage({ type: 'PLAYER_CONTROL', action: action }, '*');
            fallbackFrame.contentWindow.postMessage(JSON.stringify({ player: true, action: action }), '*');
          } catch (_error) {}
          return;
        }
        initPlayer();
        if (action === 'play') {
          try {
            var playResult = player.play();
            if (playResult && playResult.catch) playResult.catch(function() {});
          } catch (_error2) {}
        } else if (action === 'pause') {
          try { player.pause(); } catch (_error3) {}
        } else if (action === 'mute') {
          try { player.muted = true; } catch (_error4) {}
        } else if (action === 'unmute') {
          try { player.muted = false; } catch (_error5) {}
        }
      }

      function choosePreferredVariant(masterUrl, manifestText) {
        var lines = String(manifestText || '').replace(/\r/g, '').split('\n');
        var variants = [];
        var i;
        if (manifestText.indexOf('#EXT-X-STREAM-INF') === -1) return masterUrl;
        for (i = 0; i < lines.length; i++) {
          if (lines[i].indexOf('#EXT-X-STREAM-INF:') === 0) {
            var info = lines[i];
            var uri = '';
            var j = i + 1;
            var resolutionMatch = /RESOLUTION=(\d+)x(\d+)/i.exec(info);
            var bandwidthMatch = /BANDWIDTH=(\d+)/i.exec(info);
            while (j < lines.length) {
              uri = lines[j].replace(/^\s+|\s+$/g, '');
              if (uri && uri.charAt(0) !== '#') break;
              j += 1;
            }
            if (uri && uri.charAt(0) !== '#') {
              variants.push({
                url: toAbsoluteUrl(masterUrl, uri),
                height: resolutionMatch ? parseInt(resolutionMatch[2], 10) : 0,
                bandwidth: bandwidthMatch ? parseInt(bandwidthMatch[1], 10) : 0
              });
            }
          }
        }
        if (!variants.length) return masterUrl;
        variants.sort(function(a, b) {
          var aPenalty = a.height > 1080 ? (a.height - 1080) + 10000 : (1080 - a.height);
          var bPenalty = b.height > 1080 ? (b.height - 1080) + 10000 : (1080 - b.height);
          if (aPenalty !== bPenalty) return aPenalty - bPenalty;
          if (b.bandwidth !== a.bandwidth) return b.bandwidth - a.bandwidth;
          return b.height - a.height;
        });
        return variants[0].url || masterUrl;
      }

      function workerProxyUrl(url, referer) {
        var workerBase = getParam('worker') || 'https://space-tv-stream-gateway.bshipella.workers.dev';
        return workerBase + '/proxy?url=' + encodeURIComponent(url) + '&referer=' + encodeURIComponent(referer || url);
      }

      function buildVidlinkEmbedUrl() {
        var mediaType = getParam('mediaType');
        var id = getParam('id');
        var season = getParam('season') || '1';
        var episode = getParam('episode') || '1';
        var params = '?autoplay=' + (autoplay ? 'true' : 'false') + '&primaryColor=35c6ff&secondaryColor=6b7280&iconColor=35c6ff&player=default&title=false&poster=false';
        if (mediaType === 'movie') return 'https://vidlink.pro/movie/' + id + params;
        return 'https://vidlink.pro/tv/' + id + '/' + season + '/' + episode + params;
      }

      function resolveAndPlayDirect(url, captions) {
        requestText(url, function(error, manifestText) {
          initPlayer();
          switchToNative();
          showLoading();
          applyCaptions(captions);
          if (!error && manifestText && /#EXTM3U/i.test(manifestText)) {
            url = choosePreferredVariant(url, manifestText);
          }
          try {
            player.source = {
              type: 'video',
              title: 'SPACE TV',
              sources: [{
                src: url,
                type: /\.m3u8(\?|$)/i.test(url) ? 'application/vnd.apple.mpegurl' : 'video/mp4'
              }]
            };
          } catch (_error) {
            video.src = url;
            video.load();
          }
          if (autoplay) {
            setTimeout(function() { sendControl('play'); }, 120);
            setTimeout(function() { sendControl('play'); }, 900);
            setTimeout(function() { sendControl('play'); }, 1900);
          }
        });
      }

      function waitForVidlinkResolver(callback, attempts) {
        var remaining = attempts || 60;
        if (typeof window.getAdv === 'function') {
          callback(null);
          return;
        }
        if (remaining <= 0) {
          callback(new Error('VidLink resolver unavailable'));
          return;
        }
        setTimeout(function() { waitForVidlinkResolver(callback, remaining - 1); }, 50);
      }

      function bootVidlinkResolver(callback) {
        var finished = false;
        var timeoutId = setTimeout(function() {
          if (finished) return;
          finished = true;
          callback(new Error('VidLink resolver timeout'));
        }, 8000);

        function done(error) {
          if (finished) return;
          finished = true;
          clearTimeout(timeoutId);
          callback(error || null);
        }

        if (!window.WebAssembly || typeof window.Dm !== 'function' || !window.sodium || !window.sodium.ready) {
          done(new Error('VidLink runtime unsupported'));
          return;
        }
        window.sodium.ready.then(function() {
          requestArrayBuffer('_vidlink_fu.wasm', function(error, bytes) {
            var go;
            if (error || !bytes) {
              done(error || new Error('VidLink WASM missing'));
              return;
            }
            try {
              go = new window.Dm();
              WebAssembly.instantiate(bytes, go.importObject).then(function(result) {
                try { go.run(result.instance); } catch (_error) {}
                waitForVidlinkResolver(done, 80);
              }, done);
            } catch (runtimeError) {
              done(runtimeError);
            }
          });
        }, done);
      }

      function buildVidlinkApiUrl(token) {
        var mediaType = getParam('mediaType');
        var season = getParam('season') || '1';
        var episode = getParam('episode') || '1';
        if (mediaType === 'movie') return 'https://vidlink.pro/api/b/movie/' + encodeURIComponent(token) + '?multiLang=0';
        return 'https://vidlink.pro/api/b/tv/' + encodeURIComponent(token) + '/' + encodeURIComponent(season) + '/' + encodeURIComponent(episode) + '?multiLang=0';
      }

      function resolveViaWorkerFallback() {
        var mediaType = getParam('mediaType');
        var id = getParam('id');
        var season = getParam('season') || '1';
        var episode = getParam('episode') || '1';
        var workerBase = getParam('worker') || 'https://space-tv-stream-gateway.bshipella.workers.dev';
        var url = workerBase + '/resolve?tmdbId=' + encodeURIComponent(id) + '&mediaType=' + encodeURIComponent(mediaType) + '&provider=vidlink';
        if (mediaType !== 'movie') {
          url += '&season=' + encodeURIComponent(season) + '&episode=' + encodeURIComponent(episode);
        }
        requestJson(url, function(error, payload) {
          var candidates;
          var candidate;
          if (error || !payload || !payload.ok) {
            switchToFallback(workerProxyUrl(buildVidlinkEmbedUrl(), buildVidlinkEmbedUrl()));
            return;
          }
          candidates = payload.candidates || [];
          if (!candidates.length) {
            switchToFallback(workerProxyUrl(buildVidlinkEmbedUrl(), buildVidlinkEmbedUrl()));
            return;
          }
          candidate = candidates[0];
          if (candidate.direct && (candidate.playerUrl || candidate.targetUrl)) {
            resolveAndPlayDirect(candidate.playerUrl || candidate.targetUrl, candidate.captions || []);
            return;
          }
          if (candidate.playerUrl) {
            showLoading();
            switchToFallback(candidate.playerUrl);
            return;
          }
          switchToFallback(workerProxyUrl(buildVidlinkEmbedUrl(), buildVidlinkEmbedUrl()));
        });
      }

      function resolveVidlinkStream() {
        var id = getParam('id');
        var embedUrl = buildVidlinkEmbedUrl();
        if (!id) {
          showError('Missing media identifier.');
          return;
        }
        showLoading();
        bootVidlinkResolver(function(runtimeError) {
          var token;
          if (runtimeError) {
            resolveViaWorkerFallback();
            return;
          }
          try {
            token = window.getAdv(String(id));
          } catch (_error) {
            token = null;
          }
          if (!token) {
            resolveViaWorkerFallback();
            return;
          }
          requestJson(buildVidlinkApiUrl(token), function(apiError, payload) {
            var stream;
            var playlistUrl;
            if (apiError || !payload || !payload.stream) {
              resolveViaWorkerFallback();
              return;
            }
            stream = payload.stream;
            if (stream.playlist) {
              playlistUrl = workerProxyUrl(stream.playlist, embedUrl);
              resolveAndPlayDirect(playlistUrl, stream.captions || []);
              return;
            }
            if (stream.url) {
              playlistUrl = workerProxyUrl(stream.url, embedUrl);
              resolveAndPlayDirect(playlistUrl, stream.captions || []);
              return;
            }
            resolveViaWorkerFallback();
          });
        });
      }

      function resolveDirectSource(url) {
        resolveAndPlayDirect(workerProxyUrl(url, url), []);
      }

      function handleControlMessage(data) {
        var action = '';
        if (!data) return;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch (_error) { return; }
        }
        if (data.type === 'PLAYER_CONTROL') action = data.action || '';
        else if (data.player === true) action = data.action || '';
        if (!action) return;
        sendControl(action);
      }

      autoplay = getParam('autoplay') === '1';
      initPlayer();

      video.addEventListener('playing', function() {
        hideStatus();
        postEvent('play');
      });
      video.addEventListener('pause', function() { postEvent('pause'); });
      video.addEventListener('ended', function() { postEvent('ended'); });
      video.addEventListener('waiting', function() { showLoading(); postEvent('waiting'); });
      video.addEventListener('canplay', function() {
        if (autoplay) sendControl('play');
        postEvent('canplay');
      });
      video.addEventListener('error', function() {
        showError('Video failed to load.');
      });

      window.addEventListener('message', function(event) {
        if (event.source === window.parent) handleControlMessage(event.data);
        else if (usingFallback && event.source === fallbackFrame.contentWindow) {
          try { window.parent.postMessage(event.data, '*'); } catch (_error) {}
        }
      });

      if (getParam('src')) resolveDirectSource(getParam('src'));
      else resolveVidlinkStream();
    })();
  </script>
</body>
</html>
