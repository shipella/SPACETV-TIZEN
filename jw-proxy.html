<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPACE TV Proxy</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
  <script src="./legacy-polyfills.js"></script>
  <script src="./tizen-bootstrap.js"></script>
</head>
<body>
  <iframe id="player-frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin-when-cross-origin"></iframe>
  <script>
    (function () {
      function getParam(name) {
        var search = window.location.search.replace(/^\?/, "");
        if (!search) return "";
        var parts = search.split("&");
        for (var i = 0; i < parts.length; i += 1) {
          var section = parts[i].split("=");
          if (decodeURIComponent(section[0] || "") === name) {
            return decodeURIComponent((section.slice(1).join("=") || "").replace(/\+/g, "%20"));
          }
        }
        return "";
      }

      function getUrlOrigin(value) {
        try {
          return new URL(value, window.location.href).origin;
        } catch (_error) {
          return "*";
        }
      }

      function getUrlHostname(value) {
        try {
          return new URL(value, window.location.href).hostname.toLowerCase();
        } catch (_error) {
          return "";
        }
      }

      function matchesAllowedHost(hostname, allowedHost) {
        return hostname === allowedHost || hostname.slice(-(allowedHost.length + 1)) === "." + allowedHost;
      }

      function isAllowedSource(url) {
        var hostname = getUrlHostname(url);
        if (!hostname) return false;
        var allowedHosts = [
          "vidlink.pro",
          "vidsrc.to",
          "vsembed.ru",
          "workers.dev",
          "2cdns.com",
          "jwplayer.com",
          "jwplatform.com",
          "cdn.jwplayer.com",
          "content.jwplatform.com"
        ];

        for (var i = 0; i < allowedHosts.length; i += 1) {
          if (matchesAllowedHost(hostname, allowedHosts[i])) return true;
        }

        return false;
      }

      function findClosestAnchor(node) {
        while (node) {
          if (node.tagName === "A") return node;
          node = node.parentNode;
        }
        return null;
      }

      var target = getParam("src") || "";
      var frame = document.getElementById("player-frame");
      var parentOrigin = document.referrer ? getUrlOrigin(document.referrer) : getUrlOrigin(window.location.href);

      function notifyParent(type, payload) {
        try {
          window.parent.postMessage(Object.assign({ type: type }, payload || {}), parentOrigin === "null" ? "*" : parentOrigin);
        } catch (_error) {}
      }

      window.open = function () {
        return null;
      };

      try {
        if (window.top && typeof window.top.open === "function") {
          window.top.open = function () {
            return null;
          };
        }
      } catch (_error) {}

      document.addEventListener("click", function (event) {
        var targetLink = findClosestAnchor(event.target);
        if (targetLink && targetLink.getAttribute("target") === "_blank") {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      window.addEventListener("message", function (event) {
        if (event.source === window.parent) {
          try {
            frame.contentWindow && frame.contentWindow.postMessage(event.data, "*");
          } catch (_error) {}
          return;
        }

        if (event.source === frame.contentWindow) {
          if (event.origin && event.origin !== "null" && !isAllowedSource(event.origin)) {
            return;
          }
          if (event.data && event.data.type) {
            notifyParent(event.data.type, { data: event.data.data, origin: event.origin, raw: event.data });
          } else {
            notifyParent("PLAYER_EVENT", { data: event.data, origin: event.origin });
          }
        }
      });

      frame.addEventListener("load", function () {
        notifyParent("PLAYER_PROXY_READY");
      });

      if (!target) {
        notifyParent("PLAYER_ERROR", { message: "Missing player source." });
        return;
      }

      if (!isAllowedSource(target)) {
        notifyParent("PLAYER_ERROR", { message: "Blocked unapproved player source." });
        return;
      }

      frame.src = target;
    })();
  </script>
</body>
</html>
