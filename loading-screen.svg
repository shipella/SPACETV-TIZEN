<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">SPACE TV loading screen</title>
  <desc id="desc">Black loading screen with SPACE TV title and Brian Shipella credit.</desc>
  <rect width="1920" height="1080" fill="#000000"/>
  <g transform="translate(960 500)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="154" font-weight="700" letter-spacing="3">SPACE&#174;TV</text>
  </g>
  <g transform="translate(960 1010)">
    <text x="0" y="0" text-anchor="middle" fill="#8c98a8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" letter-spacing="7">DESIGNED BY BRIAN SHIPELLA</text>
  </g>
</svg>
